# Managed by project-validation-bootstrap.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=no]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--select=E4,E7,E9,F,I,UP,B,SIM]

  - repo: local
    hooks:
      - id: node-syntax-check
        name: node syntax check
        entry: scripts/node-syntax-check
        language: system
        files: \.(js|mjs|cjs)$
