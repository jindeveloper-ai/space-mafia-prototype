<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="2050년 MARS.NET에서 만난 세 화성 정착민 친구와 즐기는 3분 소셜 추리 게임"
    />
    <title>MARS.NET · 게임방 #041</title>
    <link rel="icon" type="image/png" href="./assets/images/mafia-astronaut-v2.png?v=0.15.0" />
    <link rel="apple-touch-icon" href="./assets/images/mafia-astronaut-v2.png?v=0.15.0" />
    <link rel="stylesheet" href="./styles.css?v=0.15.0" />
    <script src="./theme.js?v=0.15.0"></script>
  </head>
  <body>
    <section id="file-protocol-notice" class="file-protocol-notice" hidden>
      <span>2050 · MARS.NET</span>
      <h1 data-file-notice-title>직접 파일 실행은 지원하지 않습니다.</h1>
      <p data-file-notice-body>프로필·채팅·API 보안을 위해 로컬 서버로 실행해 주세요.</p>
      <code>scripts/serve</code>
      <a href="http://127.0.0.1:4173/?lang=ko" data-file-notice-link>서버 실행 후 앱 열기</a>
    </section>
    <main class="page-shell">
      <header class="topbar" aria-label="게임 정보">
        <a class="brand" href="./?lang=ko" aria-label="게임 처음으로">
          <span aria-hidden="true">‹</span>
          <span class="brand-name">MARS.NET</span>
        </a>
        <div class="topbar-tools">
          <div class="audio-controls">
            <button class="audio-toggle" type="button" data-audio-toggle aria-label="배경음 음소거">
              <span aria-hidden="true">♪</span>
            </button>
            <input data-audio-volume type="range" min="0" max="60" step="1" value="30" aria-label="배경음 음량" />
          </div>
          <nav class="language-switch" aria-label="언어 선택">
            <a data-lang="ko" href="./?lang=ko" hreflang="ko">KO</a>
            <a data-lang="en" href="./?lang=en" hreflang="en">EN</a>
          </nav>
          <button class="theme-toggle" type="button" data-theme-action>
            <span class="theme-icon" aria-hidden="true">◐</span>
            <span class="theme-text">시스템</span>
          </button>
        </div>
      </header>

      <section id="app" class="game-card"></section>

      <footer>
        <span class="footer-copy">MARS.NET 친구 게임방 · 한 판 약 3분 · 진행은 저장되지 않음</span>
        <span class="footer-version">v0.15.0</span>
      </footer>
    </main>
    <script src="./sound.js?v=0.15.0"></script>
    <script>
      if (window.location.protocol === "file:") {
        const language = new URLSearchParams(window.location.search).get("lang") === "en" ? "en" : "ko";
        const notice = document.querySelector("#file-protocol-notice");
        const copy = language === "en"
          ? {
              title: "Opening the app as a file is not supported.",
              body: "Run the local server so profiles, chat, and the API proxy work securely.",
              link: "Open the app after starting the server",
            }
          : {
              title: "직접 파일 실행은 지원하지 않습니다.",
              body: "프로필·채팅·API 보안을 위해 로컬 서버로 실행해 주세요.",
              link: "서버 실행 후 앱 열기",
            };
        document.documentElement.lang = language;
        document.querySelector(".page-shell").hidden = true;
        notice.hidden = false;
        notice.querySelector("[data-file-notice-title]").textContent = copy.title;
        notice.querySelector("[data-file-notice-body]").textContent = copy.body;
        notice.querySelector("[data-file-notice-link]").textContent = copy.link;
        notice.querySelector("[data-file-notice-link]").href = `http://127.0.0.1:4173/?lang=${language}`;
      } else {
        const gameScript = document.createElement("script");
        gameScript.type = "module";
        gameScript.src = "./game.js?v=0.15.0";
        document.body.append(gameScript);
      }
    </script>
  </body>
</html>
