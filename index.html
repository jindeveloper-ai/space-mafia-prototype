<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="2050년 MARS.NET에서 만난 세 화성 정착민 친구와 채팅 또는 보이스콜로 즐기는 소셜 추리 게임"
    />
    <title>MARS.NET · 게임방 #041</title>
    <link rel="icon" type="image/png" href="./assets/images/mafia-astronaut-v2.png?v=0.20.14" />
    <link rel="apple-touch-icon" href="./assets/images/mafia-astronaut-v2.png?v=0.20.14" />
    <link rel="stylesheet" href="./styles.css?v=0.20.14" />
    <link rel="stylesheet" href="./voice-call.css?v=0.20.14" />
    <link rel="stylesheet" href="./account.css?v=0.20.14" />
    <script src="./theme.js?v=0.20.14"></script>
  </head>
  <body>
    <section id="file-protocol-notice" class="file-protocol-notice" hidden>
      <span>2050 · MARS.NET</span>
      <h1 data-file-notice-title>직접 파일 실행은 지원하지 않습니다.</h1>
      <p data-file-notice-body>프로필·채팅·API 보안을 위해 로컬 서버로 실행해 주세요.</p>
      <code>scripts/serve</code>
      <a href="#" data-file-notice-link>서버 실행 후 앱 열기</a>
    </section>
    <main class="page-shell">
      <header class="topbar" aria-label="게임 정보">
        <a class="brand" href="./?lang=ko" aria-label="게임 처음으로">
          <span aria-hidden="true">‹</span>
          <span class="brand-name">MARS.NET</span>
        </a>
        <div class="topbar-tools">
          <div class="audio-controls">
            <button class="audio-toggle" type="button" data-audio-toggle aria-label="배경음 음소거">
              <span aria-hidden="true">♪</span>
            </button>
            <input data-audio-volume type="range" min="0" max="60" step="1" value="30" aria-label="배경음 음량" />
          </div>
          <button
            class="language-switch"
            type="button"
            data-language-settings-open
            aria-haspopup="dialog"
            aria-controls="language-settings-dialog"
            aria-label="언어 및 접근성 설정"
          >
            <svg class="language-switch__icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9S14.5 18.5 12 21M12 3C9.5 5.5 8.2 8.5 8.2 12s1.3 6.5 3.8 9"></path>
            </svg>
            <span class="language-switch__code" data-language-current>KO</span>
          </button>
          <button class="theme-toggle" type="button" data-theme-action>
            <span class="theme-icon" aria-hidden="true">◐</span>
            <span class="theme-text">시스템</span>
          </button>
        </div>
      </header>

      <section id="app" class="game-card"></section>

      <footer>
        <span class="footer-copy">MARS.NET 친구 게임방 · 게스트는 기기에, 로그인하면 클라우드에 저장</span>
        <span class="footer-version">v0.20.14</span>
      </footer>
    </main>
    <button
      class="language-switch language-switch--floating"
      type="button"
      data-language-settings-open
      aria-haspopup="dialog"
      aria-controls="language-settings-dialog"
      aria-label="언어 및 접근성 설정"
    >
      <svg class="language-switch__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9S14.5 18.5 12 21M12 3C9.5 5.5 8.2 8.5 8.2 12s1.3 6.5 3.8 9"></path>
      </svg>
      <span class="language-switch__code" data-language-current>KO</span>
    </button>
    <dialog
      id="language-settings-dialog"
      class="language-settings"
      data-language-settings-dialog
      aria-labelledby="language-settings-title"
      aria-describedby="language-settings-description"
    >
      <div class="language-settings__surface">
        <header class="language-settings__header">
          <div>
            <span class="language-settings__eyebrow" data-language-settings-eyebrow>언어팩</span>
            <h2 id="language-settings-title" data-language-settings-title>언어 및 접근성</h2>
            <p id="language-settings-description" data-language-settings-description>
              필요한 언어만 내려받아 앱 용량을 가볍게 유지합니다.
            </p>
          </div>
          <button class="language-settings__close" type="button" data-language-settings-close aria-label="설정 닫기">×</button>
        </header>
        <ul class="language-settings__list" data-language-settings-list aria-label="언어팩 목록"></ul>
        <p class="language-settings__notice" data-language-settings-notice aria-live="polite"></p>
      </div>
    </dialog>
    <script src="./sound.js?v=0.20.14"></script>
    <script type="module" src="./bootstrap.js?v=0.20.14"></script>
  </body>
</html>
