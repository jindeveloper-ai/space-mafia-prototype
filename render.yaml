services:
  - type: web
    name: mars-net-game-041
    runtime: python
    plan: free
    branch: codex/progression-v0.12.6
    buildCommand: python3 -m compileall -q scripts
    startCommand: python3 scripts/serve.py --bind 0.0.0.0 --port $PORT --quiet
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
